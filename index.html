<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- WICHTIG: Verhindert Zoomen und Skalieren auf mobilen Geräten -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Metro - Stabile Basis</title>
    <style>
        /* WICHTIG: Verhindert jegliches Scrollen, Wischen und Markieren auf Touchscreens */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f4f8;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
            font-family: sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none; /* UI blockiert keine Touch-Eingaben */
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
        p { margin: 0; font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Metro Basis</h1>
        <p>Ziehe Linien zwischen den Stationen.</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Farben für die Linien
        const COLORS = ['#e6194B', '#3cb44b', '#4363d8', '#f58231', '#911eb4'];
        
        // Spiel-Objekte
        let stations = [];
        let lines = [];
        let trains = [];

        // Interaktions-Status
        let isDragging = false;
        let dragStartStation = null;
        let pointerX = 0;
        let pointerY = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Station {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 15;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#333333';
                ctx.stroke();
            }
        }

        class Line {
            constructor(color) {
                this.color = color;
                this.stations = [];
            }
            draw() {
                if (this.stations.length < 2) return;
                
                ctx.beginPath();
                ctx.moveTo(this.stations[0].x, this.stations[0].y);
                for (let i = 1; i < this.stations.length; i++) {
                    ctx.lineTo(this.stations[i].x, this.stations[i].y);
                }
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = this.color;
                ctx.stroke();
            }
        }

        class Train {
            constructor(line) {
                this.line = line;
                this.currentIndex = 0;
                this.targetIndex = 1;
                this.direction = 1; // 1 = vorwärts, -1 = rückwärts
                this.progress = 0; // 0.0 bis 1.0 zwischen zwei Stationen
                this.speed = 0.015; // Konstante einfache Geschwindigkeit
                this.x = line.stations[0].x;
                this.y = line.stations[0].y;
            }

            update() {
                if (this.line.stations.length < 2) return;

                // Bewege Zug
                this.progress += this.speed;

                if (this.progress >= 1) {
                    this.progress = 0;
                    this.currentIndex = this.targetIndex;
                    this.targetIndex += this.direction;

                    // Richtung umkehren, wenn das Ende der Linie erreicht ist
                    if (this.targetIndex >= this.line.stations.length || this.targetIndex < 0) {
                        this.direction *= -1;
                        this.targetIndex = this.currentIndex + this.direction;
                    }
                }

                // Berechne aktuelle X/Y Position
                const start = this.line.stations[this.currentIndex];
                const end = this.line.stations[this.targetIndex];
                
                if (start && end) {
                    this.x = start.x + (end.x - start.x) * this.progress;
                    this.y = start.y + (end.y - start.y) * this.progress;
                }
            }

            draw() {
                ctx.fillStyle = this.line.color;
                ctx.beginPath();
                // Zeichne den Zug als kleines Rechteck
                ctx.roundRect(this.x - 12, this.y - 8, 24, 16, 4);
                ctx.fill();
            }
        }

        function getDistance(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1)**2 + (y2 - y1)**2);
        }

        function spawnInitialStations() {
            // Spawne genau 5 Stationen, die sich nicht überlappen
            let attempts = 0;
            while (stations.length < 5 && attempts < 100) {
                let x = 50 + Math.random() * (canvas.width - 100);
                let y = 100 + Math.random() * (canvas.height - 150);
                
                let valid = true;
                for (let s of stations) {
                    if (getDistance(x, y, s.x, s.y) < 80) {
                        valid = false;
                        break;
                    }
                }
                
                if (valid) {
                    stations.push(new Station(x, y));
                }
                attempts++;
            }
        }

        function getHitStation(x, y) {
            // Prüft, ob der Finger/die Maus auf eine Station tippt (mit großzügigem Radius für Touch)
            for (let s of stations) {
                if (getDistance(x, y, s.x, s.y) < s.radius * 3) {
                    return s;
                }
            }
            return null;
        }

        canvas.addEventListener('pointerdown', (e) => {
            const hit = getHitStation(e.clientX, e.clientY);
            if (hit) {
                isDragging = true;
                dragStartStation = hit;
                pointerX = e.clientX;
                pointerY = e.clientY;
            }
        });

        // Wir hören auf 'window', damit die Linie nicht abbricht, wenn der Finger den Canvas verlässt
        window.addEventListener('pointermove', (e) => {
            if (isDragging) {
                pointerX = e.clientX;
                pointerY = e.clientY;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            const hit = getHitStation(pointerX, pointerY);
            
            // Wenn wir auf einer ANDEREN Station losgelassen haben
            if (hit && hit !== dragStartStation) {
                // Erstelle eine neue Linie
                let color = COLORS[lines.length % COLORS.length];
                let newLine = new Line(color);
                newLine.stations.push(dragStartStation, hit);
                lines.push(newLine);
                
                // Füge sofort einen Zug auf dieser Linie hinzu
                trains.push(new Train(newLine));
            }
            
            dragStartStation = null;
        });

        function gameLoop() {
            // Hintergrund löschen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Fertige Linien zeichnen
            for (let line of lines) {
                line.draw();
            }

            // 2. Aktuelle Zieh-Linie zeichnen (Drag Preview)
            if (isDragging && dragStartStation) {
                ctx.beginPath();
                ctx.moveTo(dragStartStation.x, dragStartStation.y);
                ctx.lineTo(pointerX, pointerY);
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.setLineDash([10, 10]); // Gestrichelte Linie
                ctx.strokeStyle = '#999999';
                ctx.stroke();
                ctx.setLineDash([]); // Reset
            }

            // 3. Stationen zeichnen
            for (let station of stations) {
                station.draw();
            }

            // 4. Züge updaten und zeichnen
            for (let train of trains) {
                train.update();
                train.draw();
            }

            // Schleife wiederholen
            requestAnimationFrame(gameLoop);
        }

        // Spiel starten
        spawnInitialStations();
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
